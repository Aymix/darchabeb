security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_login_redirect
                enable_csrf: true
            logout:
                path: app_logout
                target: app_home

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/supervisor, roles: [ROLE_SUPERVISOR, ROLE_ADMIN] }
        - { path: ^/dashboard, roles: ROLE_USER }
        - { path: ^/feed, roles: ROLE_USER }
        - { path: ^/story, roles: ROLE_USER }
        - { path: ^/gallery, roles: ROLE_USER }
        - { path: ^/museum/submit, roles: ROLE_USER }
        - { path: ^/museum/my-submissions, roles: ROLE_USER }
        - { path: ^/museum, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
